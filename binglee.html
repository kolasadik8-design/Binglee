<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binglee Legends - Adventure</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFD700">
<link rel="icon" href="icon.png">
<style>
body{margin:0;background:linear-gradient(#0f0c29,#302b63,#24243e);color:#fff;font-family:Arial;text-align:center;overflow:hidden}
h1{color:#FFD700;text-shadow:0 0 10px #FFD700;margin:10px;font-size:26px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;max-width:500px;margin:auto}
.card{background:#fff;color:#111;border-radius:20px;padding:12px;border:5px solid #555;cursor:pointer}
.card.selected{border-color:#FFD700;transform:scale(1.08);background:#fff9c4;box-shadow:0 0 20px #FFD700}
.card span{font-size:45px;display:block}
.btn{padding:14px 30px;font-size:20px;background:#FFD700;color:#000;border:none;border-radius:30px;margin:8px;font-weight:bold}
#gameArea{width:100vw;height:70vh;background:linear-gradient(#87CEEB 0%, #E0F6FF 60%, #90EE90 100%);position:relative;display:none;overflow:hidden;border-top:4px solid #FFD700;border-bottom:4px solid #228B22}
#hero{font-size:60px;position:absolute;left:30px;top:50%;z-index:10;transition:top 0.1s}
.obstacle{position:absolute;font-size:45px;right:-80px;z-index:5}
.star{position:absolute;font-size:30px;right:-50px;z-index:6;animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.hud{position:absolute;top:8px;width:96%;left:2%;display:flex;justify-content:space-between;z-index:20}
.hud div{background:rgba(0,0,0,0.75);padding:6px 12px;border-radius:10px;font-weight:bold;font-size:14px}
#gameOver{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:30;flex-direction:column;justify-content:center;align-items:center}
</style>
</head>
<body>
<div id="selectScreen">
<h1>⭐ CHOOSE YOUR LEGEND ⭐</h1>
<div class="players">
<div class="card" onclick="choose('Rajab Binglee The Legend','🚗')"><span>🚗</span><b>RAJAB</b><br>BINGLEE</div>
<div class="card" onclick="choose('Hamoudi Kaboos The Nightmare','👻')"><span>👻</span><b>HAMOUDI</b><br>KABOOS</div>
<div class="card" onclick="choose('Bobo Lightning','⚡')"><span>⚡</span><b>BOBO</b><br>FAST</div>
<div class="card" onclick="choose('Amir The Prince','👑')"><span>👑</span><b>AMIR</b><br>PRINCE</div>
</div>
<button class="btn" onclick="startGame()">START ADVENTURE 🚀</button>
</div>

<div id="gameArea" onclick="jump()">
<div class="hud">
<div id="pName">BINGLEE</div>
<div>⭐ <span id="score">0</span> | ❤️ <span id="lives">3</span></div>
<div>LVL <span id="level">1</span></div>
</div>
<div id="hero">🚗</div>
<div id="gameOver">
<h1 style="font-size:40px">GAME OVER!</h1>
<p id="finalScore" style="font-size:24px"></p>
<button class="btn" onclick="location.reload()">PLAY AGAIN 🔄</button>
</div>
</div>
<div id="controls" style="display:none;padding:10px"><button class="btn" style="width:90%;font-size:26px;padding:20px" onclick="jump()">👆 TAP TO FLY / JUMP 👆</button><p>Collect ⭐ Avoid 🐦 🧱 ☁️</p></div>

<script>
let name='Rajab Binglee', emoji='🚗', topPos=50, score=0, lives=3, level=1, gameOn=false, obstacles=[];
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.9;u.pitch=1.1;speechSynthesis.speak(u);}
function choose(n,e){name=n;emoji=e;document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));event.currentTarget.classList.add('selected');speak(n+'!!!');}
function startGame(){document.getElementById('selectScreen').style.display='none';document.getElementById('gameArea').style.display='block';document.getElementById('controls').style.display='block';document.getElementById('hero').innerText=emoji;document.getElementById('pName').innerText=name.split(' ')[0];gameOn=true;speak(name+' start adventure!');loop();spawn();}
function jump(){if(!gameOn)return;topPos=topPos>8?topPos-18:8;document.getElementById('hero').style.top=topPos+'%';if(navigator.vibrate)navigator.vibrate(30);}
function spawn(){
 if(!gameOn)return;
 let isStar=Math.random()>0.6;
 let el=document.createElement('div');
 el.className=isStar?'star':'obstacle';
 el.innerText=isStar?'⭐':['🐦','🧱','☁️','🎈'][Math.floor(Math.random()*4)];
 el.style.top=Math.random()*70+10+'%';
 el.style.right='-80px';
 document.getElementById('gameArea').appendChild(el);
 obstacles.push({el:el,isStar:isStar,x:window.innerWidth});
 setTimeout(spawn, 1200 - level*80);
}
function loop(){
 if(!gameOn)return;
 topPos+=level*0.6+1.2; if(topPos>85)topPos=85;
 document.getElementById('hero').style.top=topPos+'%';
 let heroRect=document.getElementById('hero').getBoundingClientRect();
 obstacles.forEach((o,i)=>{
   o.x-=4+level; o.el.style.right=(window.innerWidth - o.x)+'px';
   let r=o.el.getBoundingClientRect();
   if(r.left<heroRect.right-15 && r.right>heroRect.left+15 && r.top<heroRect.bottom-10 && r.bottom>heroRect.top+10){
     if(o.isStar){score++;document.getElementById('score').innerText=score;if(score%10==0){level++;document.getElementById('level').innerText=level;speak('Level '+level+'!');if(level==2)document.getElementById('hero').innerText='✈️';}o.el.remove();obstacles.splice(i,1);speak('Star!');}
     else{lives--;document.getElementById('lives').innerText=lives;o.el.remove();obstacles.splice(i,1);speak('Ouch!');if(navigator.vibrate)navigator.vibrate(200);if(lives<=0)end();}
   }
   if(o.x<-100){o.el.remove();obstacles.splice(i,1);}
 });
 requestAnimationFrame(loop);
}
function end(){gameOn=false;document.getElementById('finalScore').innerText=name+' scored '+score+' stars! Level '+level;document.getElementById('gameOver').style.display='flex';speak('Game Over! '+score+' stars! You are still a legend '+name.split(' ')[0]);}
</script>
</body>
</html>
